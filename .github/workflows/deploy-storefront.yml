name: Deploy Storefront

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy_storefront:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static storefront release
        run: npm run build:storefront:release

      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIWA_AI_COPILOT }}
          channelId: live
          projectId: diwa-copilot-ai-491108
          target: designDocs

      - name: Post-deploy smoke check
        run: |
          SITE_URL="https://design-diwa-copilot-ai.web.app"
          for path in "/" "/components" "/styles/hover" "/developing/react" "/stencil/diwa-components.css" "/stencil/diwa-components.esm.js"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}${path}")
            echo "${path} -> ${STATUS}"
            if [ "$STATUS" -ge 400 ]; then
              echo "FAIL: ${path} returned ${STATUS}"
              exit 1
            fi
          done
          echo "All smoke checks passed."
