name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  npm-verify:
    name: npm verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm)
        run: npm ci

      - name: Token-contract gate
        run: npm run validate:tokens

      - name: Control-height gate
        run: npm run agency:validate:control-heights

      - name: Build packages
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: UX tests
        run: npm run test:ux

      - name: Storefront type-check
        run: npm run type-check

      - name: Storefront build (full release pipeline)
        run: npm run build:storefront:release

  pnpm-smoke:
    name: pnpm smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Token-contract gate
        run: pnpm run validate:tokens

      - name: Control-height gate
        run: pnpm run agency:validate:control-heights

      - name: Build components
        run: pnpm --filter @diwa-design-system/components run build

      - name: Build wrappers
        run: pnpm run build:wrappers

      - name: Unit tests
        run: pnpm run test

      - name: UX tests
        run: pnpm run test:ux

      - name: Storefront type-check
        run: pnpm run type-check

      - name: Storefront build (full release pipeline)
        run: pnpm run build:storefront:release
